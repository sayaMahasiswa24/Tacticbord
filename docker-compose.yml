services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tacticbord-app
    ports:
      - "${PORT:-8000}:80"
    environment:
      - APP_NAME="Football Tactical Board"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:${PORT:-8000}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - AI_ASSISTANT_ENABLED=false
    volumes:
      - tacticbord-db:/var/www/html/database
      - tacticbord-storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tacticbord-db:
  tacticbord-storage:
